<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo sutil e limpo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edf6fc" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2edf7" />
    </linearGradient>

    <!-- Gradiente para o botão de ação e destaques principais -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f05a28" />
      <stop offset="100%" stop-color="#ff7043" />
    </linearGradient>

    <!-- Gradiente do ícone da aplicação -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4edff" />
      <stop offset="100%" stop-color="#aed7f8" />
    </linearGradient>

    <!-- Sombras profissionais -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>

    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>

    <filter id="buttonShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#f05a28" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fundo do Banner -->
  <rect width="1200" height="500" fill="url(#bgGrad)" />

  <!-- Padrão geométrico sutil ao fundo -->
  <g opacity="0.4">
    <circle cx="1150" cy="80" r="160" fill="#e0f2fe" />
    <circle cx="80" cy="420" r="140" fill="#e2e8f0" />
    <path d="M-50,200 Q200,100 450,250 T950,150" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8 8" />
  </g>

  <!-- ================= LADO ESQUERDO: BRANDING & IDENTIDADE ================= -->
  <g transform="translate(100, 100)">
    <!-- Ícone do Aplicativo (Estilo Ubuntu Touch Squircle) -->
    <g filter="url(#softShadow)">
      <rect x="0" y="0" width="104" height="104" rx="26" fill="url(#iconBg)" />

      <!-- Ilustração interna da Logomarca (Globo, Livro e Elementos) -->
      <!-- Globo -->
      <g transform="translate(32, 14)">
        <circle cx="20" cy="20" r="16" fill="#60a5fa" stroke="#1e293b" stroke-width="2.2" />
        <path d="M12,12 Q18,8 24,14 Q28,18 26,24 Q20,26 14,20 Z" fill="#4ade80" stroke="#1e293b" stroke-width="1.8" />
        <path d="M22,26 Q28,28 32,22 Q34,30 28,34 Q22,34 22,26 Z" fill="#4ade80" stroke="#1e293b" stroke-width="1.8" />
      </g>

      <!-- Livro Aberto -->
      <g transform="translate(14, 38)">
        <!-- Páginas traseiras -->
        <path d="M8,44 C22,41 38,45 38,45 C38,45 54,41 68,44 L64,16 C50,13 38,17 38,17 C38,17 26,13 12,16 Z" fill="#fef3c7" stroke="#1e293b" stroke-width="2.2" stroke-linejoin="round" />
        <!-- Lombada / Divisão central -->
        <line x1="38" y1="17" x2="38" y2="45" stroke="#1e293b" stroke-width="2" />
        <!-- Diamante (Página Direita) -->
        <polygon points="53,24 59,24 63,28 56,35 49,28" fill="#3b82f6" stroke="#1e293b" stroke-width="1.4" />
        <!-- Círculo concêntrico (Página Esquerda) -->
        <circle cx="23" cy="30" r="5" fill="none" stroke="#ea580c" stroke-width="1.6" />
        <circle cx="23" cy="30" r="2" fill="#ea580c" />
      </g>
    </g>

    <!-- Títulos e Slogan -->
    <text x="124" y="55" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Ubuntu, sans-serif" font-size="44" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Curió PDF</text>
    <text x="124" y="90" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Ubuntu, sans-serif" font-size="20" font-weight="500" fill="#64748b">Leitor de PDF minimalista</text>

    <!-- Badges de Recursos / Destaques do App -->
    <g transform="translate(0, 140)">
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Ubuntu, sans-serif" font-size="16" font-weight="600" fill="#475569" letter-spacing="0.4">PROJETADO PARA UBUNTU TOUCH</text>

      <!-- Pílula 1: Marca-texto e caneta -->
      <g transform="translate(0, 42)">
        <rect width="210" height="38" rx="19" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
        <circle cx="22" cy="19" r="6" fill="#f05a28" />
        <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Ubuntu, sans-serif" font-size="14" font-weight="600" fill="#334155">Grifos com Texto e Caneta</text>
      </g>

      <!-- Pílula 2: Modo Leitura Contínua -->
      <g transform="translate(222, 42)">
        <rect width="180" height="38" rx="19" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
        <circle cx="20" cy="19" r="6" fill="#38bdf8" />
        <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Ubuntu, sans-serif" font-size="14" font-weight="600" fill="#334155">Rolagem Contínua</text>
      </g>

      <!-- Pílula 3: Sumário & Destaques -->
      <g transform="translate(0, 92)">
        <rect width="240" height="38" rx="19" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
        <circle cx="22" cy="19" r="6" fill="#4ade80" />
        <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Ubuntu, sans-serif" font-size="14" font-weight="600" fill="#334155">Painel de Navegação Rápida</text>
      </g>
    </g>

    <!-- Paleta oficial do app (Amarelo, Verde, Azul, Rosa) -->
    <g transform="translate(0, 275)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Ubuntu, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">PALETA DE MARCAÇÃO</text>
      <circle cx="14" cy="20" r="12" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
      <circle cx="48" cy="20" r="12" fill="#4ade80" stroke="#16a34a" stroke-width="1.5" />
      <circle cx="82" cy="20" r="12" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
      <circle cx="116" cy="20" r="12" fill="#f472b6" stroke="#db2777" stroke-width="1.5" />
    </g>
  </g>

  <!-- ================= LADO DIREITO: MOCKUP INTERATIVO DO APP ================= -->
  <g transform="translate(680, 40)">
    <!-- Base de Dispositivo Mobile Ubuntu Touch -->
    <g filter="url(#softShadow)">
      <rect x="0" y="0" width="440" height="420" rx="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    </g>

    <!-- Barra de Status Superior do Ubuntu Touch -->
    <path d="M0,36 Q0,0 36,0 L404,0 Q440,0 440,36 L440,42 L0,42 Z" fill="#ffffff" />
    <g fill="#334155" opacity="0.8" transform="translate(30, 26)">
      <!-- Ícones simples da barra superior -->
      <circle cx="340" cy="-6" r="3" />
      <rect x="352" y="-10" width="22" height="10" rx="2" fill="none" stroke="#334155" stroke-width="1.6" />
      <rect x="354" y="-8" width="16" height="6" rx="1" fill="#22c55e" />
      <text x="382" y="-2" font-family="sans-serif" font-size="10" font-weight="700">99%</text>
    </g>

    <!-- Header do App -->
    <g transform="translate(24, 52)">
      <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">sample_tb.pdf</text>
      <text x="10" y="32" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" fill="#64748b">Pág. 1 de 3</text>

      <!-- Ícone Modo Noturno (Lua) -->
      <path d="M375,12 C375,18.6 369.6,24 363,24 C361.3,24 359.8,23.6 358.4,23 C361.8,20.2 364,16 364,11.2 C364,7.8 362.7,4.8 360.6,2.5 C367,3.5 375,7.2 375,12 Z" fill="#1e293b" />
    </g>
    <line x1="0" y1="96" x2="440" y2="96" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Documento PDF Simulado em Exibição -->
    <g transform="translate(24, 110)">
      <!-- Folha PDF com sombra leve -->
      <rect x="0" y="0" width="392" height="230" rx="8" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />

      <!-- Título do Capítulo -->
      <text x="24" y="36" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#0f172a">Capitulo 1: Introducao ao Ubuntu Touch</text>

      <!-- Grifo Coral/Rosa Realístico (como na screenshot enviada) -->
      <rect x="22" y="52" width="345" height="15" rx="3" fill="#fca5a5" opacity="0.6" />
      <rect x="22" y="70" width="165" height="15" rx="3" fill="#fca5a5" opacity="0.6" />

      <!-- Pinça de Seleção Azul -->
      <circle cx="22" cy="70" r="4.5" fill="#2563eb" />
      <circle cx="187" cy="85" r="4.5" fill="#2563eb" />

      <!-- Texto do Documento -->
      <text x="24" y="63" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#1e293b">O Ubuntu Touch e um sistema operacional movel focado em privacidade...</text>
      <text x="24" y="81" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#1e293b">Este leitor de PDF oferece rolagem continua.</text>

      <!-- Seção do Capítulo 2 -->
      <g transform="translate(0, 110)">
        <rect x="0" y="0" width="392" height="1" fill="#f1f5f9" />
        <text x="24" y="30" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#0f172a">Capitulo 2: Recursos de Marcacao</text>
        <text x="24" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">Destaque partes do texto usando selecao direta ou traco livre.</text>
      </g>
    </g>

    <!-- Toolbar Flutuante de Seleção de Cores (Destaque do App) -->
    <g transform="translate(100, 270)" filter="url(#cardShadow)">
      <rect width="240" height="46" rx="23" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="40" cy="23" r="14" fill="#facc15" stroke="#eab308" stroke-width="3" />
      <circle cx="80" cy="23" r="12" fill="#4ade80" />
      <circle cx="120" cy="23" r="12" fill="#38bdf8" />
      <circle cx="160" cy="23" r="12" fill="#f472b6" />
      <!-- Botão Fechar -->
      <line x1="195" y1="18" x2="205" y2="28" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <line x1="205" y1="18" x2="195" y2="28" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Barra Inferior de Ações (Sumário, Zoom, Grifar, Salvar) -->
    <path d="M0,360 L440,360 L440,384 Q440,420 404,420 L36,420 Q0,420 0,384 Z" fill="#ffffff" />
    <line x1="0" y1="360" x2="440" y2="360" stroke="#f1f5f9" stroke-width="1.5" />

    <g transform="translate(40, 375)">
      <!-- Sumário -->
      <g opacity="0.6">
        <line x1="0" y1="6" x2="16" y2="6" stroke="#475569" stroke-width="2" />
        <line x1="0" y1="12" x2="16" y2="12" stroke="#475569" stroke-width="2" />
        <text x="-4" y="26" font-family="sans-serif" font-size="9" fill="#475569">Sumário</text>
      </g>

      <!-- Zoom -->
      <g transform="translate(85, 0)" opacity="0.6">
        <circle cx="8" cy="9" r="6" fill="none" stroke="#475569" stroke-width="2" />
        <line x1="13" y1="14" x2="17" y2="18" stroke="#475569" stroke-width="2" />
        <text x="-2" y="26" font-family="sans-serif" font-size="9" fill="#475569">Ajustar</text>
      </g>

      <!-- Grifar (Ativo no tom Laranja Ubuntu) -->
      <g transform="translate(190, -4)">
        <rect x="-10" y="-2" width="56" height="34" rx="6" fill="#fff7ed" stroke="#f05a28" stroke-width="1.2" />
        <path d="M12,2 L18,8 L7,19 L1,19 L1,13 Z" fill="#f05a28" />
        <text x="3" y="29" font-family="sans-serif" font-size="9" font-weight="700" fill="#f05a28">Grifar</text>
      </g>

      <!-- Salvar -->
      <g transform="translate(290, 0)" opacity="0.6">
        <path d="M4,2 L14,2 L14,10 L4,10 Z M2,16 L16,16" fill="none" stroke="#475569" stroke-width="2" />
        <text x="0" y="26" font-family="sans-serif" font-size="9" fill="#475569">Salvar</text>
      </g>
    </g>
  </g>
</svg>