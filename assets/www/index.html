<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>Curió PDF</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Bar Móvel Fixa -->
  <header class="mobile-header" id="app-header">
    <div class="header-left">
      <button class="touch-btn" id="btn-back" style="display: none;" title="Voltar aos Recentes" data-i18n-title="back_title" aria-label="Voltar">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="doc-title-container">
        <div class="doc-title" id="doc-title">Curió PDF</div>
        <div class="doc-subtitle" id="doc-subtitle" style="display: none;"><span id="header-page-prefix">Pág.</span> <span id="header-page-num">1</span> <span id="header-page-mid">de</span> <span id="header-total-num">1</span></div>
      </div>
    </div>
    <div class="header-right">
      <button class="touch-btn" id="btn-search" style="display: none;" title="Buscar no texto" data-i18n-title="search_title" aria-label="Buscar">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
      <button class="touch-btn" id="btn-theme" title="Modo Noturno" data-i18n-title="theme_title" aria-label="Alternar Tema">
        <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
    </div>
  </header>

  <!-- Barra de Busca Móvel -->
  <div class="mobile-search-bar" id="search-bar" style="display: none;">
    <input type="search" class="search-input" id="search-input" placeholder="Buscar palavras..." data-i18n-placeholder="search_placeholder" enterkeyhint="search">
    <span class="search-count" id="search-count"></span>
    <button class="touch-btn sm" id="btn-search-prev" title="Anterior" data-i18n-title="prev_btn">
      <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
    </button>
    <button class="touch-btn sm" id="btn-search-next" title="Próximo" data-i18n-title="next_btn">
      <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
    </button>
    <button class="touch-btn sm" id="btn-search-close" title="Fechar busca" data-i18n-title="close_search">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <!-- Barra de Ferramentas do Marca-Texto Móvel (Expansível) -->
  <div class="mobile-highlighter-tools" id="highlighter-tools" style="display: none;">
    <div class="mode-selector">
      <button class="touch-pill active" id="mode-text-btn">
        <svg viewBox="0 0 24 24"><path d="M5 4v3h5.5v12h3V7H19V4z"/></svg>
        <span data-i18n="text_mode">Texto</span>
      </button>
      <button class="touch-pill" id="mode-ink-btn">
        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        <span data-i18n="ink_mode">Caneta</span>
      </button>
    </div>
    <div class="color-palette">
      <div class="touch-color dot-yellow selected" data-color="#ffeb3b" title="Amarelo"></div>
      <div class="touch-color dot-green" data-color="#69f0ae" title="Verde"></div>
      <div class="touch-color dot-blue" data-color="#40c4ff" title="Azul"></div>
      <div class="touch-color dot-pink" data-color="#ff80ab" title="Rosa"></div>
    </div>
  </div>

  <!-- Conteúdo Principal -->
  <main class="mobile-viewport">
    <!-- Tela Inicial Móvel -->
    <div class="mobile-home-view" id="home-view">
      <div class="app-hero">
        <img src="logo.png" alt="Ícone Curió PDF" class="app-icon-img">
        <h1 class="app-name">Curió PDF</h1>
        <p class="app-tagline" data-i18n="app_tagline">Leitor de PDF minimalista.</p>
      </div>

      <input type="file" id="file-input" accept="application/pdf" style="display: none;">
      
      <!-- Botão Primário Móvel Grande integrado ao Content Hub -->
      <button class="mobile-open-btn" id="btn-open-file">
        <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
        <span data-i18n="open_pdf">Abrir Documento PDF</span>
      </button>

      <div class="recents-section">
        <div class="section-title" data-i18n="recent_docs">Documentos Recentes</div>
        <div class="recent-list" id="recent-list">
          <div class="empty-recents" data-i18n="no_recent">Nenhum documento recente.</div>
        </div>
      </div>
    </div>

    <!-- Visualizador de PDF com Rolagem Contínua -->
    <div class="mobile-pdf-container" id="pdf-viewer-container" style="display: none;"></div>
  </main>

  <!-- Bottom Bar Móvel Fixa (Controles Ergonômicos para os Polegares) -->
  <footer class="mobile-bottom-bar" id="bottom-bar" style="display: none;">
    <button class="touch-btn" id="btn-outline" title="Sumário e Destaques" data-i18n-title="btn_outline">
      <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
      <span class="btn-label" data-i18n="btn_outline">Sumário</span>
    </button>

    <button class="touch-btn" id="btn-zoom-out" title="Reduzir Zoom" data-i18n-title="btn_zoom_out">
      <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
      <span class="btn-label">Zoom -</span>
    </button>

    <button class="touch-btn" id="btn-fit-screen" title="Ajustar à tela" data-i18n-title="btn_fit">
      <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      <span class="btn-label" data-i18n="btn_fit">Ajustar</span>
    </button>

    <button class="touch-btn" id="btn-zoom-in" title="Aumentar Zoom" data-i18n-title="btn_zoom_in">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      <span class="btn-label">Zoom +</span>
    </button>

    <button class="touch-btn main-highlight-btn" id="btn-highlight-toggle" title="Marca-texto" data-i18n-title="btn_highlight">
      <svg viewBox="0 0 24 24"><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5zM3 20h18v2H3v-2z"/></svg>
      <span class="btn-label" data-i18n="btn_highlight">Grifar</span>
    </button>

    <button class="touch-btn" id="btn-export" title="Salvar / Compartilhar no Content Hub" data-i18n-title="btn_save">
      <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>
      <span class="btn-label" data-i18n="btn_save">Salvar</span>
    </button>
  </footer>

  <!-- Drawer Lateral Móvel (Sumário e Destaques) -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="mobile-drawer" id="drawer">
    <div class="drawer-header">
      <span class="drawer-title" data-i18n="navigation">Navegação</span>
      <button class="touch-btn sm" id="btn-drawer-close">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="drawer-tabs">
      <div class="drawer-tab active" id="tab-outline" data-i18n="outline_tab">Sumário</div>
      <div class="drawer-tab" id="tab-highlights" data-i18n="highlights_tab">Destaques</div>
    </div>
    <div class="drawer-content">
      <div id="drawer-outline-content"></div>
      <div id="drawer-highlights-content" style="display: none;"></div>
    </div>
  </aside>

  <!-- Toast Notificação Touch -->
  <div class="mobile-toast" id="toast"></div>

  <!-- Polyfills para WebEngine / Chromium legado -->
  <script src="js/polyfills.js"></script>

  <!-- Internacionalização (i18n) -->
  <script src="js/i18n.js"></script>

  <!-- Scripts Offline -->
  <script src="vendor/pdf.worker.min.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/pdf-viewer.js"></script>
  <script src="js/highlighter.js"></script>
  <script src="js/pdf-exporter.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
